spring:
  application:
    name: example
  datasource:
    url: jdbc:mysql://localhost:3306/file_bridge?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: filebridge
    password: filebridge
  flyway:
    locations: classpath:db/filebridge/migration
  profiles:
    active: demo
file-bridge:
  enabled: true
  default-storage: local-main
  upload:
    max-file-size: 20GB
    preferred-part-size: 8MB
    task-ttl: 24h
  storages:
    local-main:
      type: local
      root-path: ./data/files
      temp-path: ./data/uploads

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    io.github.chansan.example.web.ApiLoggingFilter: info
    io.github.chansan.filebridge.upload: info

example:
  file-bridge:
    base-path: /api/file-bridge
