<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FileBridge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui;
        background: #070a10;
        color: #edf2ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 8%, #294783 0, transparent 34%),
          radial-gradient(circle at 82% 90%, #442866 0, transparent 30%), #070a10;
      }
      .panel {
        width: min(880px, 90vw);
        padding: clamp(28px, 6vw, 68px);
        border: 1px solid #ffffff22;
        border-radius: 30px;
        background: #0c1120d9;
        box-shadow: 0 40px 120px #0009;
        backdrop-filter: blur(20px);
      }
      h1 {
        font-size: clamp(54px, 10vw, 112px);
        line-height: 0.82;
        margin: 0 0 36px;
        letter-spacing: -0.075em;
      }
      .drop {
        padding: 32px;
        border: 1px dashed #8ca8ff;
        border-radius: 20px;
        background: #ffffff07;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        background: #95adff;
        color: #071025;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
      }
      progress {
        width: 100%;
        height: 8px;
        margin-top: 22px;
      }
      pre {
        white-space: pre-wrap;
        color: #aab9df;
        min-height: 48px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>
        FILE
        <br />
        BRIDGE
      </h1>
      <div class="drop">
        <input id="file" type="file" />
        <div class="row">
          <button id="upload">开始上传</button>
          <button id="cancel" disabled>暂停调度</button>
          <span id="state">等待选择文件</span>
        </div>
        <progress id="progress" max="100" value="0"></progress>
        <pre id="result"></pre>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
