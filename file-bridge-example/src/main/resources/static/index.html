<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileBridge</title><style>:root{color-scheme:dark;font-family:Inter,system-ui;background:#070a10;color:#edf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 8%,#294783 0,transparent 34%),radial-gradient(circle at 82% 90%,#442866 0,transparent 30%),#070a10}.panel{width:min(880px,90vw);padding:clamp(28px,6vw,68px);border:1px solid #ffffff22;border-radius:30px;background:#0c1120d9;box-shadow:0 40px 120px #0009;backdrop-filter:blur(20px)}h1{font-size:clamp(54px,10vw,112px);line-height:.82;margin:0 0 36px;letter-spacing:-.075em}.drop{padding:32px;border:1px dashed #8ca8ff;border-radius:20px;background:#ffffff07}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:999px;padding:13px 22px;background:#95adff;color:#071025;font-weight:800;cursor:pointer}button:disabled{opacity:.45}progress{width:100%;height:8px;margin-top:22px}pre{white-space:pre-wrap;color:#aab9df;min-height:48px}</style></head><body><main class="panel"><h1>FILE<br>BRIDGE</h1><div class="drop"><input id="file" type="file"><div class="row"><button id="upload">开始上传</button><button id="cancel" disabled>暂停调度</button><span id="state">等待选择文件</span></div><progress id="progress" max="100" value="0"></progress><pre id="result"></pre></div></main><script type="module">import{Sha256}from'./sha256.js';const $=s=>document.querySelector(s),file=$('#file'),progress=$('#progress'),result=$('#result'),state=$('#state'),upload=$('#upload'),cancel=$('#cancel');let paused=false;cancel.onclick=()=>{paused=true;cancel.disabled=true;state.textContent='已暂停，可再次点击开始上传恢复'};upload.onclick=async()=>{const f=file.files[0];if(!f)return;paused=false;cancel.disabled=false;try{state.textContent='计算文件摘要';const hash=new Sha256(),scan=4*1024*1024;for(let o=0;o<f.size;o+=scan){hash.update(await f.slice(o,Math.min(f.size,o+scan)).arrayBuffer());progress.value=Math.min(10,o/f.size*10);await new Promise(requestAnimationFrame)}const sha=hash.digest(),resumeKey=`filebridge:${f.size}:${sha}`,saved=localStorage.getItem(resumeKey);let init;if(saved){const status=await json(`/api/file-bridge/uploads/${saved}`);init={mode:'UPLOAD',uploadId:saved,partSize:status.partSize,totalParts:status.totalParts,completedParts:status.completedParts}}else{init=await json('/api/file-bridge/uploads',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({originalName:f.name,size:f.size,sha256:sha,contentType:f.type||'application/octet-stream'})});if(init.mode==='INSTANT'){progress.value=100;result.textContent=JSON.stringify(init,null,2);state.textContent='秒传完成';return}localStorage.setItem(resumeKey,init.uploadId);init.completedParts=[]}const done=new Set(init.completedParts||[]);for(let n=1;n<=init.totalParts;n++){while(paused)await new Promise(r=>setTimeout(r,300));if(done.has(n))continue;const start=(n-1)*init.partSize,body=f.slice(start,Math.min(f.size,start+init.partSize));await json(`/api/file-bridge/uploads/${init.uploadId}/parts/${n}`,{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body},true);progress.value=10+85*n/init.totalParts;state.textContent=`上传分片 ${n}/${init.totalParts}`}const completed=await json(`/api/file-bridge/uploads/${init.uploadId}/complete`,{method:'POST'});progress.value=100;result.textContent=JSON.stringify(completed,null,2);state.textContent='服务端正在合并和校验';localStorage.removeItem(resumeKey)}catch(e){state.textContent='上传失败';result.textContent=e.message}finally{cancel.disabled=true}};async function json(url,options={},empty=false){const r=await fetch(url,options);if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return empty?{}:r.json()}</script></body></html>
